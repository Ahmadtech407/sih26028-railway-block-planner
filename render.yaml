services:
  # -------------------------------------------------------------
  # 1. FastAPI REST & Optimizer Backend (24/7 Cloud Service)
  # -------------------------------------------------------------
  - type: web
    name: sih26028-railway-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sections
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: RAIL_API_PROVIDER
        value: RAPIDAPI_IRCTC
      - key: RAPIDAPI_HOST
        value: irctc1.p.rapidapi.com
      - key: ENVIRONMENT
        value: production
      - key: RAILTRACK_JWT_SECRET
        value: "railtrack-prod-auth-secret-key-sih26028-v1"
      - key: CORS_ORIGINS
        value: "https://railway-block-planner-ei5s.onrender.com,https://sih26028-railway-backend.onrender.com,https://sih26028-railtrack-passenger.onrender.com" 

  # -------------------------------------------------------------
  # 2. Streamlit Passenger Portal Frontend (24/7 Cloud Service)
  # -------------------------------------------------------------
  - type: web
    name: sih26028-railtrack-passenger
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run passenger_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        value: https://sih26028-railway-backend.onrender.com
