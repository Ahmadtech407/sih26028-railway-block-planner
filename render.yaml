services:
  - type: web
    name: sih26028-railway-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sections
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAIL_API_PROVIDER
        value: RAPIDAPI_IRCTC
      - key: RAPIDAPI_HOST
        value: irctc1.p.rapidapi.com
